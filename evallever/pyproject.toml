[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evallever"
version = "0.1.0"
description = "Evaluation leverage toolkit: leverage arm, minimum-seeds prescription, contract-violation audit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
eval-lever = "evallever.cli:main"

[tool.setuptools]
packages = ["evallever"]
